<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>かずのくみあわせ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap');

:root {
  --accent1:#ff5252; --accent2:#ffd600; --accent3:#00c853; --accent4:#2979ff;
  --text:#2d1a0e; --shadow:0 8px 24px rgba(0,0,0,0.13);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
body{font-family:'Nunito',sans-serif;background:#fff8f0;height:100dvh;overflow:hidden;user-select:none;}
.screen{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;}
.screen.active{display:flex;}

/* ═══════════════════════ TOP SCREEN ═══════════════════════ */
#screen-top{background:linear-gradient(160deg,#fef9d7 0%,#fde2ea 35%,#e8d8f4 65%,#d4eef8 100%);}

/* Floating decorations — bigger, brighter, more visible */
.top-deco{
  position:absolute; pointer-events:none;
  font-size:clamp(38px,10vw,80px);
  filter:drop-shadow(0 3px 6px rgba(0,0,0,0.10));
  animation:floatDeco 3.5s ease-in-out infinite;
  opacity:0.82;
}
.top-deco:nth-child(1){top:3%;  left:3%;  animation-delay:0s;   font-size:clamp(32px,8vw,62px);}
.top-deco:nth-child(2){top:5%;  right:4%; animation-delay:.7s;  font-size:clamp(28px,7vw,56px);}
.top-deco:nth-child(3){top:22%; left:1%;  animation-delay:1.3s; font-size:clamp(24px,6vw,48px);}
.top-deco:nth-child(4){top:18%; right:1%; animation-delay:2.0s; font-size:clamp(24px,6vw,48px);}
.top-deco:nth-child(5){bottom:20%;left:2%;animation-delay:0.4s; font-size:clamp(28px,7vw,56px);}
.top-deco:nth-child(6){bottom:18%;right:2%;animation-delay:1.1s;font-size:clamp(28px,7vw,56px);}
.top-deco:nth-child(7){bottom:5%;left:5%; animation-delay:1.8s; font-size:clamp(22px,5.5vw,44px);}
.top-deco:nth-child(8){bottom:4%;right:5%;animation-delay:2.5s; font-size:clamp(22px,5.5vw,44px);}
@keyframes floatDeco{0%,100%{transform:translateY(0)rotate(-6deg)scale(1);}50%{transform:translateY(-16px)rotate(6deg)scale(1.08);}}

.top-inner{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(10px,2.5vw,18px);
  padding:16px;width:100%;max-width:480px;overflow-y:auto;
}

/* ── TITLE: solid readable style ── */
.top-title-wrap{
  position:relative; text-align:center; line-height:1.35;
  padding:clamp(12px,3vw,20px) clamp(18px,4.5vw,30px);
  background: rgba(255,255,255,0.82);
  border-radius: 28px;
  backdrop-filter: blur(6px);
  box-shadow: 0 4px 18px rgba(200,160,180,0.18);
  width: 100%;
}
.top-title{
  font-size:clamp(24px,6.5vw,50px);
  font-weight:900;
  color: #5a3e52;
  text-shadow: none;
  animation:titleBounce 2.5s ease-in-out infinite;
  display:block;
}
.top-title .line2{
  color: #7b9fd4;
}
@keyframes titleBounce{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}

.top-section-label{font-size:clamp(12px,2.8vw,16px);font-weight:800;color:#9e7b8c;align-self:flex-start;padding-left:2px;}

.target-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(5px,1.3vw,9px);width:100%;}
.target-btn{
  aspect-ratio:1;border:none;border-radius:14px;
  font-family:'Nunito',sans-serif;font-size:clamp(15px,3.8vw,24px);font-weight:900;color:white;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,0.10);transition:transform .12s,box-shadow .12s;border:3px solid transparent;
  text-shadow:0 1px 3px rgba(0,0,0,0.18);
}
.target-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.10);}
.target-btn.mix-btn{grid-column:span 2;aspect-ratio:auto;padding:clamp(8px,2vw,14px) 6px;background:linear-gradient(135deg,#f4a8c0,#c9b1fd);font-size:clamp(13px,3.2vw,20px);}
.target-btn.selected{border:3px solid #f6c90e;box-shadow:0 0 0 3px #f6c90e,0 4px 0 rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,0.10);transform:scale(1.08);}

.level-row{display:flex;gap:clamp(7px,1.8vw,13px);width:100%;}
.level-btn{
  flex:1;padding:clamp(10px,2.5vw,16px) 4px;border:none;border-radius:50px;
  font-family:'Nunito',sans-serif;font-size:clamp(13px,3.2vw,20px);font-weight:800;color:white;cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.2),var(--shadow);transition:transform .12s,box-shadow .12s;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.level-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12);}
.level-btn.lv1{background:linear-gradient(135deg,#ffb3c6,#ffa0b4);color:white;text-shadow:0 1px 3px rgba(0,0,0,0.15);}
.level-btn.lv2{background:linear-gradient(135deg,#93c6f4,#7eb8e8);color:white;text-shadow:0 1px 3px rgba(0,0,0,0.15);}
.level-btn.lv3{background:linear-gradient(135deg,#c9b1fd,#b59cf8);color:white;text-shadow:0 1px 3px rgba(0,0,0,0.15);}
.level-badge{font-size:.72em;background:rgba(255,255,255,.35);border-radius:20px;padding:1px 8px;}

/* ═══════════════════════ GAME SCREEN ═══════════════════════ */
#screen-game{background:linear-gradient(180deg,#e4f2ff 0%,#fffbe8 100%);}

.hud{
  width:100%;flex-shrink:0;
  padding:clamp(5px,1.3vw,10px) clamp(8px,2vw,16px);
  display:flex;align-items:center;justify-content:space-between;gap:5px;z-index:10;
}
.hud-pill{background:white;border-radius:50px;padding:clamp(4px,1vw,8px) clamp(8px,2vw,16px);box-shadow:var(--shadow);display:flex;align-items:center;gap:4px;flex-shrink:0;}
.hud-label{font-size:clamp(9px,2vw,12px);color:#999;font-weight:700;}
.hud-target-num{font-size:clamp(20px,5vw,36px);font-weight:900;color:var(--accent1);line-height:1;}
.hud-score-num{font-size:clamp(13px,3vw,18px);font-weight:900;color:var(--text);}
.hud-lv{font-size:clamp(10px,2.2vw,14px);font-weight:800;color:var(--accent4);}

/* Timer pill – turns red when low */
.hud-timer-num{font-size:clamp(16px,4vw,26px);font-weight:900;color:var(--accent3);line-height:1;transition:color .3s;}
.hud-timer-num.low{color:var(--accent1);animation:timerPulse .5s ease-in-out infinite alternate;}
@keyframes timerPulse{0%{transform:scale(1);}100%{transform:scale(1.15);}}

.hud-controls{display:flex;gap:5px;flex-shrink:0;}
.hud-btn{border:none;border-radius:50px;padding:clamp(4px,1vw,8px) clamp(7px,1.8vw,12px);font-family:'Nunito',sans-serif;font-size:clamp(9px,2vw,12px);font-weight:800;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform .1s;}
.hud-btn:active{transform:translateY(2px);box-shadow:none;}
.btn-pause{background:var(--accent2);color:#3a2a1a;}
.btn-end{background:var(--accent1);color:white;}

/* MIX bar – 2 lines, full width */
#mix-target-bar{
  width:100%;flex-shrink:0;
  display:none;justify-content:center;align-items:center;
  padding:0 10px clamp(5px,1.2vw,10px);
}
#mix-target-bar.visible{display:flex;}
.mix-target-pill{
  background:linear-gradient(135deg,#ff5252,#ff9800);
  color:white;border-radius:20px;
  padding:clamp(8px,2vw,14px) clamp(14px,3.5vw,24px);
  font-size:clamp(16px,4.2vw,26px);font-weight:900;
  box-shadow:var(--shadow);
  text-align:center;line-height:1.4;
  width:100%;max-width:420px;
}
.mix-num{
  font-size:1.55em;display:inline-block;
  background:rgba(255,255,255,.28);border-radius:12px;
  padding:0 10px;margin:0 3px;line-height:1.2;
}

#game-area{position:relative;flex:1;width:100%;overflow:hidden;}

/* ── BUBBLES ── */
.bubble{
  position:absolute;display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-family:'Nunito',sans-serif;font-weight:900;color:#4a3060;
  cursor:pointer;border:4px solid rgba(255,255,255,.75);
  box-shadow:0 6px 18px rgba(0,0,0,.12);will-change:transform;
  text-shadow:0 1px 0 rgba(255,255,255,0.6);
}
.bubble.selected{
  border:6px solid #ffd600 !important;
  box-shadow:0 0 0 6px #ffd600,0 0 0 13px rgba(255,214,0,.32),0 8px 28px rgba(0,0,0,.28) !important;
  z-index:10 !important;
  animation:selectedPulse .42s ease-in-out infinite alternate !important;
}
@keyframes selectedPulse{0%{transform:scale(1.14)rotate(-4deg);}100%{transform:scale(1.26)rotate(4deg);}}
.bubble.shake{animation:shakeAnim .55s ease !important;}
@keyframes shakeAnim{0%,100%{transform:translateX(0);}14%{transform:translateX(-13px)scale(1.06);}28%{transform:translateX(13px)scale(1.06);}42%{transform:translateX(-9px);}57%{transform:translateX(9px);}71%{transform:translateX(-5px);}85%{transform:translateX(5px);}}
.bubble.burst{animation:burstAnim .5s ease forwards !important;pointer-events:none;}
@keyframes burstAnim{0%{transform:scale(1);opacity:1;}40%{transform:scale(1.8);opacity:.7;}100%{transform:scale(0);opacity:0;}}
.bubble.fadeout{animation:fadeOut .8s ease forwards !important;pointer-events:none;}
@keyframes fadeOut{0%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(.5)translateY(-30px);}}

.confetti-piece{position:absolute;width:11px;height:11px;border-radius:3px;animation:confettiFall linear forwards;z-index:20;pointer-events:none;}
@keyframes confettiFall{0%{opacity:1;transform:translateY(0)rotate(0deg);}100%{opacity:0;transform:translateY(110dvh)rotate(820deg);}}

/* ── PAUSE OVERLAY ── */
#pause-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:200;align-items:center;justify-content:center;}
#pause-overlay.on{display:flex;}
.pause-card{background:white;border-radius:28px;padding:clamp(24px,6vw,42px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:16px;align-items:center;}
.pause-card h2{font-size:clamp(22px,5.5vw,34px);font-weight:900;color:var(--text);}
.ubtn{padding:clamp(10px,2.5vw,16px) clamp(20px,5vw,36px);border:none;border-radius:50px;font-family:'Nunito',sans-serif;font-size:clamp(14px,3.5vw,20px);font-weight:800;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15),var(--shadow);transition:transform .1s;}
.ubtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15);}
.ubtn-blue{background:linear-gradient(135deg,#2979ff,#00c853);color:white;}
.ubtn-gray{background:#efefef;color:#555;}

/* ═══════════════════════ RESULT SCREEN ═══════════════════════ */
#screen-result{
  background:linear-gradient(160deg,#fef9d7 0%,#fde2ea 35%,#e8d8f4 65%,#d4eef8 100%);
  gap:clamp(14px,3.5vw,24px);padding:24px;text-align:center;
}
.result-emoji{font-size:clamp(56px,14vw,96px);animation:bounceEmoji .55s ease-in-out infinite alternate;}
@keyframes bounceEmoji{0%{transform:scale(1)rotate(-6deg);}100%{transform:scale(1.16)rotate(6deg);}}
.result-title{font-size:clamp(26px,6.5vw,50px);font-weight:900;color:#5a3e52;}
.result-score-box{
  background:white;border-radius:24px;
  padding:clamp(14px,3.5vw,24px) clamp(24px,6vw,44px);
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.result-score-label{font-size:clamp(13px,3.2vw,18px);color:#888;font-weight:800;}
.result-score-num{
  font-size:clamp(56px,14vw,96px);font-weight:900;line-height:1;
  background:linear-gradient(135deg,#ff5252,#ff9800,#ffd600);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.result-score-unit{font-size:clamp(16px,4vw,26px);color:#aaa;font-weight:800;}
.result-comment{font-size:clamp(14px,3.5vw,20px);color:#555;font-weight:700;white-space:pre-line;}
.result-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:4px;}
.result-btn{
  padding:clamp(12px,3vw,18px) clamp(22px,5.5vw,38px);border:none;border-radius:50px;
  font-family:'Nunito',sans-serif;font-size:clamp(15px,3.8vw,21px);font-weight:800;
  cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15),var(--shadow);transition:transform .1s;
}
.result-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15);}
.result-btn.go{background:linear-gradient(135deg,#93c6f4,#b0e0b0);color:white;text-shadow:0 1px 3px rgba(0,0,0,0.15);}
.result-btn.quit{background:rgba(255,255,255,0.75);color:#9e7b8c;border:2px solid #e8c8d8;}
</style>
</head>
<body>

<!-- ══ TOP SCREEN ══ -->
<div id="screen-top" class="screen active">
  <!-- Colourful decorations (more visible) -->
  <div class="top-deco">🌟</div>
  <div class="top-deco">🎈</div>
  <div class="top-deco">⭐</div>
  <div class="top-deco">🎀</div>
  <div class="top-deco">🍀</div>
  <div class="top-deco">🌈</div>
  <div class="top-deco">🎵</div>
  <div class="top-deco">🦋</div>

  <div class="top-inner">
    <div class="top-title-wrap">
      <span class="top-title">かずのくみあわせを<br><span class="line2">さがそう！</span></span>
    </div>

    <div class="top-section-label">👇 たしてなんになる？</div>
    <div class="target-grid" id="target-grid"></div>

    <div class="top-section-label">👇 レベルをえらんでね</div>
    <div class="level-row">
      <button class="level-btn lv1" onclick="startGame(1)"><span class="level-badge">レベル 1</span>ゆっくり</button>
      <button class="level-btn lv2" onclick="startGame(2)"><span class="level-badge">レベル 2</span>ふつう</button>
      <button class="level-btn lv3" onclick="startGame(3)"><span class="level-badge">レベル 3</span>はやい！</button>
    </div>
  </div>
</div>

<!-- ══ GAME SCREEN ══ -->
<div id="screen-game" class="screen">
  <div class="hud">
    <div class="hud-pill">
      <span class="hud-label">たす</span>
      <span class="hud-target-num" id="hud-target">7</span>
      <span class="hud-label">！</span>
    </div>
    <div class="hud-pill"><span class="hud-lv" id="hud-lv">レベル 1</span></div>
    <div class="hud-pill">
      <span class="hud-label">⏱</span>
      <span class="hud-timer-num" id="hud-timer">30</span>
    </div>
    <div class="hud-pill"><span>⭐</span><span class="hud-score-num" id="hud-score">0</span></div>
    <div class="hud-controls">
      <button class="hud-btn btn-pause" id="btn-pause" onclick="togglePause()">⏸</button>
      <button class="hud-btn btn-end" onclick="endGame()">おわる</button>
    </div>
  </div>

  <!-- MIX mode bar: 2-line layout -->
  <div id="mix-target-bar">
    <div class="mix-target-pill">
      たして<br><span class="mix-num" id="mix-num">？</span>になるかずをさがそう！
    </div>
  </div>

  <div id="game-area"></div>
</div>

<!-- ══ RESULT SCREEN ══ -->
<div id="screen-result" class="screen">
  <div class="result-emoji" id="result-emoji">🎉</div>
  <div class="result-title" id="result-title">じかんぎれ！</div>
  <div class="result-score-box">
    <div class="result-score-label">30びょうで</div>
    <div class="result-score-num" id="result-score-num">0</div>
    <div class="result-score-unit">もん せいかい！</div>
  </div>
  <div class="result-comment" id="result-comment">すごい！</div>
  <div class="result-btns">
    <button class="result-btn go" onclick="replayGame()">もういちど！</button>
    <button class="result-btn quit" onclick="goHome()">おわる</button>
  </div>
</div>

<!-- ══ PAUSE OVERLAY ══ -->
<div id="pause-overlay">
  <div class="pause-card">
    <div style="font-size:48px">⏸</div>
    <h2>ポーズ中</h2>
    <button class="ubtn ubtn-blue" onclick="togglePause()">つづける</button>
    <button class="ubtn ubtn-gray" onclick="endGame()">おわる</button>
  </div>
</div>

<script>
/* ════════ CONFIG ════════ */
const COLORS=[
  ['#ffb3ba','#f98fa0'],  // pastel rose
  ['#ffc9a0','#f5a87a'],  // pastel peach
  ['#ffe599','#f5cc55'],  // pastel yellow
  ['#b5ead7','#7dcfad'],  // pastel mint
  ['#9ec8f4','#6aacec'],  // pastel sky blue
  ['#c9b1fd','#ab8ff5'],  // pastel lavender
  ['#f4a8c0','#e87aaa'],  // pastel pink
  ['#a8d8ea','#6dbfda'],  // pastel teal
  ['#ffd6a5','#f5b86e'],  // pastel apricot
  ['#caffbf','#8ee88e'],  // pastel green
  ['#e8c9f0','#cc99e0'],  // pastel lilac
  ['#bde0fe','#7ec4fe'],  // pastel cornflower
];

/* maxPairs = correct pairs kept on screen; maxDecoys = filler numbers */
const LV={
  1:{maxPairs:2,maxDecoys:2,spawnMs:3200,lifetimeMs:14000},
  2:{maxPairs:2,maxDecoys:3,spawnMs:2000,lifetimeMs:8500},
  3:{maxPairs:3,maxDecoys:3,spawnMs:1200,lifetimeMs:5500},
};

const GAME_TIME=30; // seconds

/* Comment based on score */
function scoreComment(s){
  if(s===0)  return 'つぎはがんばろう！';
  if(s<=2)   return 'もうすこし！';
  if(s<=5)   return 'いいね！';
  if(s<=9)   return 'すごい！';
  if(s<=14)  return 'とってもじょうず！';
  if(s<=19)  return 'めちゃくちゃすごい！';
  return 'かんぺき！チャンピオン！🏆';
}
function scoreEmoji(s){
  if(s===0)  return '😢';
  if(s<=2)   return '😊';
  if(s<=5)   return '🌟';
  if(s<=9)   return '🎉';
  if(s<=14)  return '🏅';
  return '🏆';
}

/* ════════ STATE ════════ */
let level=1,targetMode=7,target=7,score=0;
let paused=false,gameOver=false;
let firstSel=null;
let bubbles=[],nextId=0;
let spawnTimer=null,rafId=null,floatTime=0,lastRaf=null;
let countdownTimer=null,timeLeft=GAME_TIME;

/* ════════ TOP SCREEN BUILD ════════ */
(function(){
  const grid=document.getElementById('target-grid');
  // Pastel button colors for 3–10
  const nc=[
    ['#ffb3ba','#ff8fab'],  // 3  pastel rose
    ['#ffc9a0','#ffad7d'],  // 4  pastel peach
    ['#ffe599','#ffd166'],  // 5  pastel yellow
    ['#b5ead7','#85d4b0'],  // 6  pastel mint
    ['#9ec8f4','#6fb0e8'],  // 7  pastel sky
    ['#c9b1fd','#ae94f5'],  // 8  pastel lavender
    ['#f4a8c0','#e882a6'],  // 9  pastel pink
    ['#a8d8ea','#7ec4d8'],  // 10 pastel teal
  ];
  for(let n=3;n<=10;n++){
    const btn=document.createElement('button');
    btn.className='target-btn';btn.textContent=n;btn.dataset.val=n;
    btn.style.background=`linear-gradient(135deg,${nc[n-3][0]},${nc[n-3][1]})`;
    btn.onclick=()=>selectTarget(n,btn);
    grid.appendChild(btn);
  }
  const mix=document.createElement('button');
  mix.className='target-btn mix-btn';mix.textContent='MIX 🎲';mix.dataset.val='mix';
  mix.onclick=()=>selectTarget('mix',mix);
  grid.appendChild(mix);
  selectTarget(7,grid.querySelector('[data-val="7"]'));
})();

function selectTarget(val,btn){
  document.querySelectorAll('.target-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  targetMode=val;
}

/* ════════ GAME START ════════ */
function startGame(lv){
  level=lv;score=0;paused=false;gameOver=false;
  firstSel=null;bubbles=[];nextId=0;timeLeft=GAME_TIME;
  document.getElementById('game-area').innerHTML='';
  document.getElementById('pause-overlay').classList.remove('on');
  document.getElementById('btn-pause').textContent='⏸';
  target=pickTarget();
  updateHUD();showMixBar();
  showScreen('screen-game');
  refillBubbles();
  scheduleSpawn();
  startRAF();
  startCountdown();
}

function replayGame(){ startGame(level); }

function pickTarget(){
  if(targetMode==='mix'){
    const p=[3,4,5,6,7,8,9,10];
    return p[rand(0,p.length-1)];
  }
  return targetMode;
}

function updateHUD(){
  document.getElementById('hud-target').textContent=target;
  document.getElementById('hud-lv').textContent='レベル '+level;
  document.getElementById('hud-score').textContent=score;
  const te=document.getElementById('hud-timer');
  te.textContent=timeLeft;
  te.classList.toggle('low',timeLeft<=10);
}

function showMixBar(){
  const bar=document.getElementById('mix-target-bar');
  const num=document.getElementById('mix-num');
  if(targetMode==='mix'){bar.classList.add('visible');num.textContent=target;}
  else bar.classList.remove('visible');
}

function stopAllTimers(){
  clearTimeout(spawnTimer);spawnTimer=null;
  clearInterval(countdownTimer);countdownTimer=null;
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  bubbles.forEach(b=>clearTimeout(b.lifetimeTimer));
}

/* ════════ COUNTDOWN ════════ */
function startCountdown(){
  clearInterval(countdownTimer);
  countdownTimer=setInterval(()=>{
    if(paused||gameOver) return;
    timeLeft--;
    const te=document.getElementById('hud-timer');
    te.textContent=timeLeft;
    te.classList.toggle('low',timeLeft<=10);
    if(timeLeft<=0){
      clearInterval(countdownTimer);
      timeUp();
    }
  },1000);
}

function timeUp(){
  gameOver=true;
  stopAllTimers();
  setTimeout(showResult,400);
}

/* ════════ RESULT SCREEN ════════ */
function showResult(){
  document.getElementById('result-emoji').textContent=scoreEmoji(score);
  document.getElementById('result-title').textContent=timeLeft<=0?'じかんぎれ！':'おわり！';
  document.getElementById('result-score-num').textContent=score;
  document.getElementById('result-comment').textContent=scoreComment(score);
  showScreen('screen-result');
  // confetti
  const scr=document.getElementById('screen-result');
  const W=scr.clientWidth,H=scr.clientHeight;
  const cols=['#ff5252','#ffd600','#00c853','#2979ff','#d500f9','#ff9800'];
  for(let i=0;i<50;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.cssText=`position:absolute;left:${rand(5,W-5)}px;top:${rand(0,H*.35)}px;background:${cols[rand(0,cols.length-1)]};animation-duration:${rand(8,18)/10}s;animation-delay:${rand(0,12)/10}s;z-index:50;`;
    scr.appendChild(p);
    setTimeout(()=>p.remove(),2400);
  }
}

/* ════════ PAIR LOGIC ════════ */
function countPairsOnScreen(){
  const vals=bubbles.map(b=>b.value);
  const used=new Set();let count=0;
  for(let i=0;i<vals.length;i++){
    if(used.has(i))continue;
    for(let j=i+1;j<vals.length;j++){
      if(used.has(j))continue;
      if(vals[i]+vals[j]===target){used.add(i);used.add(j);count++;break;}
    }
  }
  return count;
}

function allPairCombos(){
  const pairs=[];
  for(let a=1;a<=9;a++){const b=target-a;if(b>=1&&b<=9&&a<=b)pairs.push([a,b]);}
  return pairs;
}

function pickPairToAdd(){
  const combos=allPairCombos();shuffle(combos);
  const freq={};
  bubbles.forEach(b=>freq[b.value]=(freq[b.value]||0)+1);
  for(const [a,b] of combos){
    const fa=freq[a]||0,fb=freq[b]||0;
    if(a===b){if(fa<2)return[a,b];}
    else if(fa===0&&fb===0)return[a,b];
  }
  for(const [a,b] of combos){
    const fa=freq[a]||0,fb=freq[b]||0;
    if(a===b){if(fa<2)return[a,b];}
    else if(fa===0||fb===0)return[a,b];
  }
  return combos[0];
}

function refillBubbles(){
  if(paused||gameOver)return;
  const cfg=LV[level];
  let pairs=countPairsOnScreen(),safety=0;
  while(pairs<cfg.maxPairs&&safety<10){
    safety++;
    const [a,b]=pickPairToAdd();
    const freq={};bubbles.forEach(bub=>freq[bub.value]=(freq[bub.value]||0)+1);
    const fa=freq[a]||0,fb=freq[b]||0;
    if(a===b){const need=2-fa;for(let i=0;i<need;i++)placeBubble(a);}
    else{if(fa===0)placeBubble(a);if(fb===0)placeBubble(b);}
    const np=countPairsOnScreen();
    if(np===pairs)break;
    pairs=np;
  }
  const total=cfg.maxPairs*2+cfg.maxDecoys;
  let att=0;
  while(bubbles.length<total&&att<20){att++;placeBubble(rand(1,9));}
}

/* ════════ PLACE BUBBLE ════════ */
function placeBubble(value){
  const area=document.getElementById('game-area');
  const W=area.clientWidth,H=area.clientHeight;
  const size=clamp(Math.min(W,H)*0.18,65,105);
  const pad=size*0.55;
  let x,y,tries=0;
  do{
    x=rand(pad,W-pad-size);y=rand(pad,H-pad-size);tries++;
  }while(tries<60&&bubbles.some(b=>{const dx=b.x-x,dy=b.y-y;return Math.sqrt(dx*dx+dy*dy)<size*1.1;}));

  const ci=rand(0,COLORS.length-1);
  const[c1,c2]=COLORS[ci];
  const el=document.createElement('div');
  el.className='bubble';
  el.style.cssText=`width:${size}px;height:${size}px;font-size:${Math.round(size*.44)}px;left:${x}px;top:${y}px;background:radial-gradient(circle at 38% 35%,white 0%,${c1} 45%,${c2} 100%);opacity:0;transform:scale(0)rotate(-20deg);`;
  el.textContent=value;
  const id=nextId++;
  const bubble={id,el,value,x,y,size,floatPhase:Math.random()*Math.PI*2,floatSpeed:1.0+Math.random(),lifetimeTimer:null,dying:false};
  bubbles.push(bubble);
  area.appendChild(el);
  el.addEventListener('pointerdown',e=>{e.stopPropagation();onTap(bubble);});
  requestAnimationFrame(()=>{el.style.transition='opacity .15s,transform .4s cubic-bezier(.34,1.56,.64,1)';el.style.opacity='1';el.style.transform='scale(1)rotate(0deg)';});
  const lt=LV[level].lifetimeMs+rand(-1200,1200);
  bubble.lifetimeTimer=setTimeout(()=>expireBubble(bubble),lt);
  return bubble;
}

function expireBubble(bubble){
  if(bubble.dying)return;
  bubble.dying=true;clearTimeout(bubble.lifetimeTimer);
  const idx=bubbles.indexOf(bubble);if(idx!==-1)bubbles.splice(idx,1);
  if(firstSel===bubble)firstSel=null;
  bubble.el.style.transition='';bubble.el.classList.add('fadeout');
  setTimeout(()=>bubble.el.remove(),860);
  setTimeout(()=>refillBubbles(),950);
}

/* ════════ SPAWN LOOP ════════ */
function scheduleSpawn(){
  if(gameOver)return;
  clearTimeout(spawnTimer);
  spawnTimer=setTimeout(()=>{
    if(!paused&&!gameOver)refillBubbles();
    scheduleSpawn();
  },LV[level].spawnMs+rand(-300,300));
}

/* ════════ TAP ════════ */
function onTap(bubble){
  if(paused||gameOver||bubble.dying)return;
  if(firstSel&&firstSel.id===bubble.id){
    bubble.el.classList.remove('selected');firstSel=null;return;
  }
  if(!firstSel){
    firstSel=bubble;bubble.el.style.transition='';bubble.el.classList.add('selected');return;
  }
  const a=firstSel,b=bubble;
  if(a.value+b.value===target)doCorrect(a,b);
  else doWrong(a,b);
}

function doCorrect(a,b){
  firstSel=null;a.el.classList.remove('selected');
  burstBubble(a);burstBubble(b);
  spawnConfetti(a.x+a.size/2,a.y+a.size/2);
  spawnConfetti(b.x+b.size/2,b.y+b.size/2);
  score++;document.getElementById('hud-score').textContent=score;
  if(targetMode==='mix'){
    target=pickTarget();
    document.getElementById('hud-target').textContent=target;
    showMixBar();
    setTimeout(()=>clearAndRefill(),350);
  } else {
    setTimeout(()=>refillBubbles(),520);
  }
}

function clearAndRefill(){
  const toKeep=new Set();const used=new Set();
  for(let i=0;i<bubbles.length;i++){
    for(let j=i+1;j<bubbles.length;j++){
      if(!used.has(i)&&!used.has(j)&&bubbles[i].value+bubbles[j].value===target){
        toKeep.add(i);toKeep.add(j);used.add(i);used.add(j);
      }
    }
  }
  bubbles.slice().forEach((b,i)=>{
    if(!toKeep.has(i)&&!b.dying){
      b.dying=true;clearTimeout(b.lifetimeTimer);
      const idx=bubbles.indexOf(b);if(idx!==-1)bubbles.splice(idx,1);
      b.el.classList.add('fadeout');setTimeout(()=>b.el.remove(),860);
    }
  });
  setTimeout(()=>refillBubbles(),400);
}

function doWrong(a,b){
  a.el.classList.remove('selected');firstSel=null;
  [a,b].forEach(bub=>{
    bub.el.classList.remove('shake');void bub.el.offsetWidth;
    bub.el.classList.add('shake');setTimeout(()=>bub.el.classList.remove('shake'),570);
  });
  setTimeout(()=>refillBubbles(),400);
}

function burstBubble(bubble){
  bubble.dying=true;clearTimeout(bubble.lifetimeTimer);
  const idx=bubbles.indexOf(bubble);if(idx!==-1)bubbles.splice(idx,1);
  bubble.el.style.transition='';bubble.el.classList.remove('selected','shake');
  bubble.el.classList.add('burst');setTimeout(()=>bubble.el.remove(),540);
}

/* ════════ FLOAT ════════ */
function startRAF(){
  lastRaf=performance.now();
  function loop(now){
    const dt=Math.min((now-lastRaf)/1000,.05);lastRaf=now;
    if(!paused){
      floatTime+=dt;
      bubbles.forEach(b=>{
        if(b.dying||b.el.classList.contains('selected')||b.el.classList.contains('shake'))return;
        b.el.style.transform=`translateY(${Math.sin(floatTime*b.floatSpeed+b.floatPhase)*9}px)`;
      });
    }
    rafId=requestAnimationFrame(loop);
  }
  rafId=requestAnimationFrame(loop);
}

/* ════════ CONFETTI ════════ */
function spawnConfetti(cx,cy){
  const area=document.getElementById('game-area');
  const cols=['#ff5252','#ffd600','#00c853','#2979ff','#d500f9','#ff9800','#00bcd4'];
  for(let i=0;i<24;i++){
    const p=document.createElement('div');p.className='confetti-piece';
    const angle=Math.random()*Math.PI*2,r=rand(8,70);
    p.style.cssText=`left:${cx+Math.cos(angle)*r}px;top:${cy+Math.sin(angle)*r}px;background:${cols[rand(0,cols.length-1)]};animation-duration:${rand(5,11)/10}s;animation-delay:${rand(0,2)/10}s;`;
    area.appendChild(p);setTimeout(()=>p.remove(),1200);
  }
}

/* ════════ PAUSE / END ════════ */
function togglePause(){
  paused=!paused;
  document.getElementById('pause-overlay').classList.toggle('on',paused);
  document.getElementById('btn-pause').textContent=paused?'▶':'⏸';
  if(!paused){lastRaf=performance.now();scheduleSpawn();}
  else clearTimeout(spawnTimer);
}

function endGame(){
  stopAllTimers();
  document.getElementById('pause-overlay').classList.remove('on');
  paused=false;goHome();
}

function goHome(){
  stopAllTimers();
  paused=false;gameOver=false;bubbles=[];firstSel=null;
  document.getElementById('game-area').innerHTML='';
  showScreen('screen-top');
}

/* ════════ UTILS ════════ */
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function clamp(v,lo,hi){return Math.min(Math.max(v,lo),hi);}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=rand(0,i);[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
</script>
